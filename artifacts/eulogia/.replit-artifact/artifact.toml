kind = "web"
previewPath = "/"
title = "Eulogia and Elogies Project"
version = "1.0.0"
id = "artifacts/eulogia"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 19939

[services.development]
run = "pnpm --filter @workspace/eulogia run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/eulogia", "run", "build" ]
publicDir = "artifacts/eulogia/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "19939"
BASE_PATH = "/"
